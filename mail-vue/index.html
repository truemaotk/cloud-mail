<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="mail · 收发和管理邮件">
  <title>mail</title>
  <link rel="icon" href="%BASE_URL%mail.svg" type="image/svg+xml">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
    }
    const metaTag = document.getElementById('theme-color-meta');
    const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
    metaTag.setAttribute('content', isDark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#191A23' : '#F1F1F1'));
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  #loading-first {
    --startup-background: #fff;
    --startup-track: #e9e9eb;
    --startup-indicator: #626267;
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color, var(--startup-background));
  }

  .dark #loading-first {
    --startup-background: #141414;
    --startup-track: #333336;
    --startup-indicator: #b5b5ba;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .loading-image {
    display: block;
    width: 60px;
    height: 60px;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 10%);
  }

  .loading-progress {
    position: relative;
    width: 72px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--startup-track);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: var(--startup-indicator);
    animation: startup-sweep 1.3s ease-in-out infinite;
  }

  @keyframes startup-sweep {
    from { transform: translateX(-100%); }
    to { transform: translateX(250%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-progress::before {
      animation: none;
      transform: translateX(75%);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="%BASE_URL%mail.svg" alt="mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
